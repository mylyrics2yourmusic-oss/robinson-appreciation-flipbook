<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>12th Pastor &amp; Wife’s Appreciation</title><style>body{background:#24171b;color:white;text-align:center;font:16px Arial;margin:0}header{padding:15px}main{max-width:760px;margin:auto;padding:0 12px}img{display:block;max-width:100%;max-height:78vh;margin:auto;box-shadow:0 5px 20px #0009}nav{padding:14px}button{font-size:17px;padding:12px;background:#f5dca1;border:0;border-radius:6px;margin:5px}#count{padding:5px}</style></head><body><header><b>12th Pastor &amp; Wife’s Appreciation</b></header><main><img id="page" src="page1.png" alt="Program page 1"><nav><button onclick="move(-1)">❮ Previous</button><span id="count">1 of 4</span><button onclick="move(1)">Next ❯</button></nav></main><script>let i=1;function move(n){i=Math.max(1,Math.min(4,i+n));document.getElementById('page').src='page'+i+'.png';document.getElementById('count').textContent=i+' of 4'}let x;document.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(x!==undefined&&Math.abs(e.changedTouches[0].screenX-x)>60)move(e.changedTouches[0].screenX<x?1:-1);x=undefined},{passive:true});</script></body></html>
